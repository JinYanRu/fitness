server:
  port: 8080

spring:
  application:
    name: fitness-ocr

  datasource:
    url: ${DB_URL:jdbc:mysql://172.16.11.155:3306/fitness_ocr?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:AJmGYMpJuptTIOsZAP5B}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# OCR 服务配置
ocr:
  service:
    rapid-url: ${OCR_SERVICE_URL:http://172.16.11.155:8000}
    timeout: 30000

# 大模型服务配置
llm:
  service:
    api-url: ${LLM_API_URL:https://ark.cn-beijing.volces.com/api/v3/responses}
    api-key: ${LLM_API_KEY:ark-5b7932d2-2e1b-40e6-aa2b-5bc8c6b01110-d5139}
    model: ${LLM_MODEL:doubao-seed-2.0-mini-260428}
    timeout: 30000

# JWT 配置
jwt:
  secret: ${JWT_SECRET:fitness-ocr-dev-secret-key-2024-please-use-a-longer-secret-key-for-production-env}
  expiration: 604800
  header: Authorization
  token-prefix: "Bearer "
